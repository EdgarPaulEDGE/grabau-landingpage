# Statische Vorschau auf GitHub Pages: bei jedem Push auf main wird die
# Seite ohne Backend exportiert (die Lead-API existiert dort nicht, das
# Formular zeigt den direkten E-Mail-Fallback).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # API-Route aus dem Export nehmen: output "export" unterstützt keine
      # Route-Handler. Das Repo selbst bleibt unverändert.
      - run: rm -rf src/app/api
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
      # Asset-Pfade auf den Pages-Unterordner /grabau-landingpage/ umschreiben
      - run: node scripts/pages-prefix.mjs out grabau-landingpage
      # _next/ beginnt mit Unterstrich: ohne .nojekyll würde Jekyll es verwerfen
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
